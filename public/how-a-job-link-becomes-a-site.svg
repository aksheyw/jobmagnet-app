<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="330" fill="#FFFFFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1B2A4A">What happens after you paste a job link</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B6E5F"/>
    </marker>
  </defs>

  <!-- column labels -->
  <text x="120" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6169" letter-spacing="1">1. YOU PASTE</text>
  <text x="450" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6169" letter-spacing="1">2. FIVE AGENTS BUILD IT</text>
  <text x="785" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6169" letter-spacing="1">3. YOU GET A SITE</text>

  <!-- column 1: input, in this repo -->
  <rect x="20" y="86" width="200" height="96" rx="10" fill="#F3F5F9" stroke="#B9BEC6"/>
  <text x="120" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4A">Your profile</text>
  <text x="120" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4A">+ a job link</text>
  <rect x="20" y="198" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#B9BEC6" stroke-dasharray="4 3"/>
  <text x="120" y="223" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B6169">jobmagnet-app (this repo)</text>
  <text x="120" y="243" text-anchor="middle" font-size="12" fill="#5B6169">the website, on Vercel</text>

  <!-- arrow 1 -> 2 -->
  <line x1="222" y1="134" x2="250" y2="134" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- column 2: the agents, in the engine room -->
  <rect x="256" y="80" width="388" height="214" rx="12" fill="#E6F4F1" stroke="#0E9384"/>

  <rect x="272" y="94" width="356" height="40" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="450" y="119" text-anchor="middle" font-size="13.5" fill="#1B2A4A"><tspan font-weight="700">Research</tspan>  reads the job, finds the real employer</text>

  <line x1="450" y1="134" x2="450" y2="146" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="134" x2="340" y2="146" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="134" x2="560" y2="146" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="272" y="150" width="112" height="70" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="328" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4A">Brand</text>
  <text x="328" y="191" text-anchor="middle" font-size="11.5" fill="#5B6169">looks up colors</text>
  <text x="328" y="207" text-anchor="middle" font-size="11.5" fill="#5B6169">and fonts</text>

  <rect x="394" y="150" width="112" height="70" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="450" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4A">Narrative</text>
  <text x="450" y="191" text-anchor="middle" font-size="11.5" fill="#5B6169">your story, retold</text>
  <text x="450" y="207" text-anchor="middle" font-size="11.5" fill="#5B6169">for this job</text>

  <rect x="516" y="150" width="112" height="70" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="572" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2A4A">Pitch</text>
  <text x="572" y="191" text-anchor="middle" font-size="11.5" fill="#5B6169">optional PM-style</text>
  <text x="572" y="207" text-anchor="middle" font-size="11.5" fill="#5B6169">critique, from your note</text>

  <line x1="450" y1="220" x2="450" y2="232" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="220" x2="410" y2="232" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="220" x2="490" y2="232" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="272" y="236" width="356" height="40" rx="8" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="450" y="261" text-anchor="middle" font-size="13.5" fill="#1B2A4A"><tspan font-weight="700">Code</tspan>  assembles and zips a Next.js site (no AI)</text>

  <text x="450" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#0B6E5F">jobmagnet-codex (the engine room), on a rented server (VPS)</text>

  <!-- arrow 2 -> 3 -->
  <line x1="644" y1="134" x2="684" y2="134" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- column 3: output -->
  <rect x="690" y="86" width="190" height="96" rx="10" fill="#E6F4F1" stroke="#0E9384"/>
  <text x="785" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A4A">A portfolio website</text>
  <text x="785" y="140" text-anchor="middle" font-size="12.5" fill="#0B6E5F">styled after that company</text>
  <text x="785" y="160" text-anchor="middle" font-size="12" fill="#5B6169">downloaded as a zip</text>
  <line x1="785" y1="182" x2="785" y2="194" stroke="#0B6E5F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="198" width="190" height="62" rx="10" fill="#FFFFFF" stroke="#0E9384"/>
  <text x="785" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A4A">You deploy it</text>
  <text x="785" y="243" text-anchor="middle" font-size="12" fill="#5B6169">to your own Vercel</text>

</svg>
